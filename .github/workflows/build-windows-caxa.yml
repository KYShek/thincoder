name: Build ThinCoder Windows EXE (caxa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 获取 package.json 版本
        id: get_version
        shell: pwsh
        run: |
          $json = Get-Content package.json -Raw | ConvertFrom-Json
          echo "version=$($json.version)" >> $env:GITHUB_OUTPUT

      - name: 清理环境（删除 .git 防止打包体积过大）
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .git -ErrorAction SilentlyContinue

      - name: 全局安装 caxa
        run: npm install -g caxa

      - name: 用 caxa 打包成 exe
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $outputName = "thincoder-$version-win.exe"
          caxa --input . --output $outputName -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/bin/thincoder.cjs"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: thincoder-windows-caxa
          path: "thincoder-${{ steps.get_version.outputs.version }}-win.exe"
