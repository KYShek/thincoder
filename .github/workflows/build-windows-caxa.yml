name: Build ThinCoder Windows EXE (caxa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装项目依赖（其实无依赖）
        run: npm install --omit=dev

      - name: 全局安装 caxa
        run: npm install -g caxa

      - name: 用 caxa 打包成 exe
        run: |
          caxa --input . --output thincoder.exe -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/bin/thincoder.cjs"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: thincoder-windows-caxa
          path: thincoder.exe
